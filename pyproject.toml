
[project]
name = "reinforcement-learning"
version = "0.1.0"
description = "Ray RLlib experiments"
requires-python = ">=3.12,<3.13"

dependencies = [
    "ray[rllib,tune,default]==2.59.0",
    "torch==2.11.0",
    "gymnasium[classic-control,box2d,mujoco]",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "tensorboard",
    "jupyterlab",
    "ipywidgets",
]

[tool.uv]
# Scripts live in src/ and are put on PYTHONPATH.
package = false

# CUDA 12.8 PyTorch wheels, usable for CPU execution too.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
]
