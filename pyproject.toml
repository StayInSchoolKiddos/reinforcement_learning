[project]
name = "reinforcement-learning"
version = "0.1.0"
description = "Ray RLlib experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ray[rllib,tune,default]==2.59.0",
    "torch>=2.14",
    "gymnasium[classic-control,box2d,mujoco]",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "tensorboard",
    "jupyterlab",
    "ipywidgets",
]

[tool.uv]
# Scripts live in src/ and are put on PYTHONPATH; no need to build/install this project.
package = false

# CUDA 12.6 PyTorch wheels (they also run on CPU-only hosts).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
